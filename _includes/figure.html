<figure class="fig{% if include.class %} {{ include.class }}{% endif %}"><a class="zoom" href="{{ include.src | relative_url }}" aria-label="Open full-size image"><img src="{{ include.src | relative_url }}" alt="{{ include.alt | default: include.caption | strip_html | escape }}" loading="lazy"></a>{% if include.caption %}<figcaption>{{ include.caption }}</figcaption>{% endif %}</figure>
