<svg xmlns="http://www.w3.org/2000/svg" width="970" height="540" viewBox="0 0 970 540" role="img" aria-labelledby="t d">
<title id="t">Cameraman robot ROS 2 architecture</title>
<desc id="d">The camera image goes to a YOLOv8 person detector. One branch drives the gimbal: framing controller, rate-limited PID stabilizer, then the gimbal position controller. The other branch estimates the target's bearing and distance and feeds four motion modes. Follow-behind and side tracking command the drive base directly; cinematic orbit and indoor navigation go through Nav2, which uses LiDAR and odometry.</desc>
<style>
  .bg{fill:#ffffff}
  .box{fill:#ffffff;stroke:#d9d4cb;stroke-width:1.2}
  .hl{fill:#e4e4e4;stroke:#0e0e0e;stroke-width:1.4}
  .alt{fill:#f3f1ed;stroke:#d9d4cb;stroke-width:1.2}
  text{font-family:"Inter Tight","Helvetica Neue",Helvetica,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;fill:#1c1b19}
  .t{font-size:13px;font-weight:600}
  .m{font-family:"JetBrains Mono",ui-monospace,Menlo,monospace;font-size:11.5px;font-weight:500}
  .s{font-size:11.5px;fill:#6b675f}
  .g{font-size:11px;letter-spacing:.08em;fill:#0e0e0e;font-weight:600}
  .w{stroke:#8a857c;stroke-width:1.4;fill:none}
  .dash{stroke-dasharray:4 4}
  .a{fill:#8a857c}
  @media (prefers-color-scheme: dark){
    .bg{fill:#1b1a19}
    .box{fill:#232220;stroke:#3a3835}
    .hl{fill:#2a2a2a;stroke:#ececec}
    .alt{fill:#1f1e1c;stroke:#3a3835}
    text{fill:#ecebe8}
    .s{fill:#a19d95}
    .g{fill:#ececec}
    .w{stroke:#8f8a82}
    .a{fill:#8f8a82}
  }
</style>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="a" d="M0 0L10 5L0 10z"/></marker></defs>
<rect class="bg" width="970" height="540" rx="14"/>

<text class="g" x="20" y="34">SIMULATION</text>
<text class="g" x="200" y="34">PERCEPTION</text>
<text class="g" x="390" y="34">FRAMING &amp; STATE</text>
<text class="g" x="610" y="34">MOTION MODES</text>
<text class="g" x="800" y="34">CONTROL</text>

<!-- simulation -->
<rect class="alt" x="20" y="70" width="150" height="46" rx="9"/><text class="t" x="95" y="90" text-anchor="middle">RGB camera</text><text class="s" x="95" y="106" text-anchor="middle">640 × 360, Gazebo</text>
<rect class="alt" x="20" y="384" width="150" height="40" rx="9"/><text class="t" x="95" y="409" text-anchor="middle">2D LiDAR</text>
<rect class="alt" x="20" y="440" width="150" height="40" rx="9"/><text class="t" x="95" y="465" text-anchor="middle">Odometry + TF</text>

<!-- perception -->
<rect class="hl" x="200" y="150" width="160" height="78" rx="11"/><text class="m" x="280" y="178" text-anchor="middle">person_detector</text><text class="s" x="280" y="197" text-anchor="middle">YOLOv8n person class</text><text class="s" x="280" y="213" text-anchor="middle">+ temporal filtering</text>

<!-- framing branch -->
<rect class="box" x="390" y="60" width="190" height="50" rx="9"/><text class="m" x="485" y="81" text-anchor="middle">framing_gimbal_controller</text><text class="s" x="485" y="99" text-anchor="middle">image error → yaw / pitch target</text>
<rect class="box" x="390" y="130" width="190" height="50" rx="9"/><text class="m" x="485" y="151" text-anchor="middle">gimbal_stabilizer</text><text class="s" x="485" y="169" text-anchor="middle">rate-limited PID</text>
<!-- state branch -->
<rect class="box" x="390" y="226" width="190" height="64" rx="9"/><text class="m" x="485" y="248" text-anchor="middle">target_follow_state_estimator</text><text class="s" x="485" y="266" text-anchor="middle">bearing + monocular distance</text><text class="s" x="485" y="281" text-anchor="middle">(uses measured gimbal yaw)</text>

<!-- modes -->
<rect class="box" x="610" y="208" width="160" height="38" rx="9"/><text class="t" x="690" y="232" text-anchor="middle">Follow-behind</text>
<rect class="box" x="610" y="256" width="160" height="38" rx="9"/><text class="t" x="690" y="280" text-anchor="middle">Side tracking</text>
<rect class="box" x="610" y="330" width="160" height="38" rx="9"/><text class="t" x="690" y="354" text-anchor="middle">Cinematic orbit</text>
<rect class="box" x="610" y="378" width="160" height="38" rx="9"/><text class="t" x="690" y="402" text-anchor="middle">Indoor navigation</text>
<text class="s" x="690" y="196" text-anchor="middle">direct velocity control</text>
<text class="s" x="690" y="434" text-anchor="middle">planned through Nav2</text>

<!-- control -->
<rect class="box" x="800" y="130" width="150" height="50" rx="9"/><text class="m" x="875" y="151" text-anchor="middle">gimbal_position</text><text class="s" x="875" y="169" text-anchor="middle">ros2_control, yaw + pitch</text>
<rect class="box" x="800" y="226" width="150" height="50" rx="9"/><text class="m" x="875" y="247" text-anchor="middle">diff_drive_controller</text><text class="s" x="875" y="265" text-anchor="middle">ros2_control</text>
<rect class="box" x="800" y="330" width="150" height="86" rx="9"/><text class="t" x="875" y="354" text-anchor="middle">Nav2</text><text class="s" x="875" y="372" text-anchor="middle">map server + AMCL</text><text class="s" x="875" y="388" text-anchor="middle">planner + DWB</text><text class="s" x="875" y="404" text-anchor="middle">velocity smoother</text>

<!-- wires: perception -->
<path class="w" d="M170 93H185V189H198" marker-end="url(#ar)"/>
<text class="s" x="104" y="138">/camera/image_raw</text>
<path class="w" d="M360 175H375V85H388" marker-end="url(#ar)"/>
<path class="w" d="M360 205H375V258H388" marker-end="url(#ar)"/>
<path class="w" d="M485 110V128" marker-end="url(#ar)"/>
<path class="w" d="M580 155H798" marker-end="url(#ar)"/>
<!-- state to modes -->
<path class="w" d="M580 258H595"/>
<path class="w" d="M595 227V397"/>
<path class="w" d="M595 227H608" marker-end="url(#ar)"/>
<path class="w" d="M595 275H608" marker-end="url(#ar)"/>
<path class="w" d="M595 349H608" marker-end="url(#ar)"/>
<path class="w" d="M595 397H608" marker-end="url(#ar)"/>
<!-- modes to control -->
<path class="w" d="M770 227H785V251H798" marker-end="url(#ar)"/>
<path class="w" d="M770 275H785V251"/>
<path class="w" d="M770 349H798" marker-end="url(#ar)"/>
<path class="w" d="M770 397H798" marker-end="url(#ar)"/>
<path class="w" d="M875 330V278" marker-end="url(#ar)"/>
<!-- sensors to nav2 -->
<path class="w" d="M170 404H190V500H905V418" marker-end="url(#ar)"/>
<path class="w" d="M170 460H190"/>
<text class="s" x="560" y="493" text-anchor="middle">/scan, /odom, TF → costmaps and localization</text>

<text class="s" x="20" y="528">Safety: stale or low-confidence target state → zero base velocity (measured 0.34 s after the last target message).</text>
</svg>
